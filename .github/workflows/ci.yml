name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Build
        run: dotnet build src/McpGuardian/McpGuardian.csproj --configuration Release
      - name: Test
        run: dotnet run --project tests/McpGuardian.Tests/McpGuardian.Tests.csproj --configuration Release
      - name: Scan vulnerable example
        run: dotnet run --project src/McpGuardian/McpGuardian.csproj --configuration Release -- scan examples/vulnerable/mcp.json --format json
      - name: Verify secure example
        run: dotnet run --project src/McpGuardian/McpGuardian.csproj --configuration Release -- scan examples/secure/mcp.json --fail-on high

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build mcp-guardian.slnx --configuration Release
      - name: Test
        run: dotnet run --project tests/McpGuardian.Tests/McpGuardian.Tests.csproj --configuration Release --no-build
      - name: Verify secure example
        run: dotnet run --project src/McpGuardian/McpGuardian.csproj --configuration Release --no-build -- scan examples/secure/mcp.json --fail-on high
      - name: Generate SARIF report
        run: dotnet run --project src/McpGuardian/McpGuardian.csproj --configuration Release --no-build -- scan examples/vulnerable/mcp.json --format sarif --output artifacts/mcp-guardian.sarif
      - name: Upload SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/mcp-guardian.sarif
      - name: Pack .NET tool
        run: dotnet pack src/McpGuardian/McpGuardian.csproj --configuration Release --no-build --output artifacts
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: mcp-guardian-dotnet-tool
          path: artifacts/*.nupkg
